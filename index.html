<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02050f">
<title>翔馬育成シミュレーション</title>
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one-screen phone game. Header / scene (image + pixel props, flex) / stats / dialog / action menu. Retro navy RPG panels. */
:root{
  --bg:#070d1f; --panel:#0b2147; --panel2:#10305f; --edge:#7db4ff; --edge-dark:#03102a;
  --ink:#f3f7ff; --dim:#9bb4dd; --hot:#ff5a7a; --cyan:#3aa0ff; --grn:#2ecc8f; --gold:#ffd24a; --call:#ff7ac8; --line:#06c755;
  --font:'DotGothic16',"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
button{font-family:var(--font); color:var(--ink)}
.panel{background:var(--panel); border:3px solid var(--edge); border-radius:4px; box-shadow:0 0 0 2px var(--edge-dark), inset 0 0 0 2px var(--edge-dark)}
.app{height:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:8px}

.head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 10px}
.head h1{margin:0; font-size:16px; font-weight:400; line-height:1.2}
.head .sub{font-size:9.5px; color:var(--dim); margin-top:2px; line-height:1.3}
.day{font-size:13px; white-space:nowrap; color:var(--gold); text-align:right; line-height:1.3}

.scene{position:relative; flex:1 1 0; min-height:150px; overflow:hidden; padding:0; background:#04122e}
.stage{position:absolute; left:0; top:0; width:100%; height:100%; animation:bob 1.1s steps(1,end) infinite}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.stage img{position:absolute; inset:0; width:100%; height:100%; display:block; transition:filter .3s}
.ov{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; shape-rendering:crispEdges}
.ov text{font-family:var(--font); paint-order:stroke; stroke:#000; stroke-width:5px; stroke-linejoin:round}
.ov text.plain{stroke:none}
.slot{font-size:11px; color:var(--dim)}
.f-t1 #sceneImg{filter:sepia(.22) saturate(1.15) brightness(1.05)}
.f-t2 #sceneImg{filter:brightness(.62) hue-rotate(-10deg) saturate(1.15)}
.act.ghost{background:var(--panel); opacity:.85}
.gift.big{color:#7dffb0; border-color:#7dffb0; font-size:28px}
.f-pachi #sceneImg{filter:brightness(.7) saturate(1.6) hue-rotate(12deg)}
.act.sparkle{position:relative; border-color:var(--gold); color:#fff; text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
  background:linear-gradient(110deg,#10305f 35%,#ffe27a 50%,#10305f 65%); background-size:260% 100%; animation:shine 1.3s linear infinite;
  box-shadow:0 0 0 2px var(--edge-dark),0 0 12px 2px rgba(255,210,74,.75)}
.act.sparkle::before,.act.sparkle::after{content:'★'; position:absolute; color:#fff2a8; font-size:14px; text-shadow:none; animation:blink .5s steps(1,end) infinite}
.act.sparkle::before{left:8px; top:3px}
.act.sparkle::after{right:10px; bottom:3px; animation-delay:.25s}
@keyframes shine{0%{background-position:100% 0}100%{background-position:-100% 0}}
.f-bar #sceneImg{filter:saturate(1.35) brightness(.85)}
.f-night #sceneImg{filter:brightness(.5) hue-rotate(-14deg) saturate(1.2)}
.f-sleep #sceneImg{filter:brightness(.38)}
.f-solo #sceneImg{filter:brightness(.5) saturate(.8)}
.f-wake #sceneImg{filter:sepia(.35) brightness(1.15) saturate(1.2)}
.f-police #sceneImg{filter:brightness(.75)}
.f-jail #sceneImg{filter:grayscale(.9) brightness(.65)}
.f-fight #sceneImg{filter:saturate(1.4) contrast(1.1)}
.scene.street #sceneImg{filter:grayscale(.85) brightness(.5) contrast(1.1)}
.scene.shake{animation:shake .4s steps(2,end)}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
.flash{position:absolute; inset:0; background:rgba(255,50,50,.55); opacity:0; pointer-events:none}
.flash.on{animation:flashA .6s steps(1,end)}
@keyframes flashA{0%{opacity:1}25%{opacity:0}50%{opacity:.8}75%{opacity:0}}
.call{position:absolute; left:8px; right:8px; top:8px; padding:6px 8px; background:var(--call); color:#2a0a1e; text-align:center; font-size:14px; border:2px solid #2a0a1e; animation:blink .5s steps(1,end) infinite}
.call.line{background:var(--line); color:#fff; border-color:#033d1b}
.tag{position:absolute; left:8px; bottom:8px; padding:3px 8px; font-size:12px; background:rgba(3,16,42,.82); border:2px solid var(--edge)}
@keyframes blink{50%{opacity:.5}}
.blink{animation:blink .6s steps(1,end) infinite}
.rise{animation:rise 1.2s steps(6,end) infinite}
@keyframes rise{0%{transform:translateY(20px);opacity:0}30%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.drip{animation:drip 1s steps(5,end) infinite}
@keyframes drip{0%{transform:translateY(-10px);opacity:1}100%{transform:translateY(30px);opacity:0}}
.steam{animation:steam 1.4s steps(6,end) infinite}
@keyframes steam{0%{transform:translateY(10px);opacity:0}40%{opacity:.9}100%{transform:translateY(-40px);opacity:0}}
.slide{animation:slide 3.2s steps(24,end) infinite}
@keyframes slide{0%{transform:translateX(780px)}100%{transform:translateX(-360px)}}
.swing{animation:swing .5s steps(5,end) forwards}
@keyframes swing{0%{transform:translate(0,0)}100%{transform:translate(-270px,60px) rotate(-18deg)}}
.pop{animation:pop .5s steps(3,end) .35s both}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{transform-box:fill-box; transform-origin:center}
.siren1{animation:blink .4s steps(1,end) infinite}
.siren2{animation:blink .4s steps(1,end) .2s infinite}
.glow{animation:blink 1s steps(1,end) infinite}

.stats{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; padding:8px 10px}
.st .row{display:flex; justify-content:space-between; font-size:12px; line-height:1.3}
.st .row b{font-weight:400; font-variant-numeric:tabular-nums}
.bar{height:8px; margin-top:3px; background:#04122e; border:1px solid var(--edge-dark)}
.fill{height:100%; width:0; transition:width .6s steps(12,end)}
.wide{grid-column:1 / -1}
.money b{color:var(--gold)}
.money b.neg{color:var(--hot)}

.dialog{position:relative; display:flex; gap:10px; align-items:flex-start; width:100%; min-height:96px; padding:8px 10px; text-align:left; cursor:pointer; background:var(--panel); font-size:15px}
.dialog:focus-visible,.act:focus-visible,.btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.av{flex:0 0 58px; width:58px; height:58px; border:2px solid var(--edge); background:#04122e; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:24px}
.av img{width:100%; height:100%; object-fit:cover; display:block}
.av.mom{background:#ff7ac8; color:#2a0a1e}
.av.oth{background:#4b5b86}
.av.nar{background:#04122e; color:var(--dim)}
.tx{flex:1 1 0; min-width:0}
.nm{font-size:12px; color:var(--gold); border-bottom:1px solid var(--edge-dark); padding-bottom:2px; margin-bottom:4px}
.ms{white-space:pre-wrap; line-height:1.5; min-height:4.5em; overflow-wrap:anywhere}
.arrow{position:absolute; right:12px; bottom:6px; color:var(--gold); font-size:13px; animation:blink .7s steps(1,end) infinite}

.menu{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px}
.act{display:block; width:100%; text-align:center; padding:14px 8px; background:var(--panel2); border:3px solid var(--edge); border-radius:4px; box-shadow:0 0 0 2px var(--edge-dark); cursor:pointer; font-size:15px; line-height:1.3}
.act:last-child:nth-child(odd){grid-column:1 / -1}
.act:active:not(:disabled){background:#1f6feb}
.act:disabled{opacity:.42; cursor:default}

.ov2{position:fixed; inset:0; z-index:20; background:rgba(4,10,28,.94); display:flex; align-items:flex-start; justify-content:center; overflow:auto;
  padding-top:max(12px,env(safe-area-inset-top,0px)); padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%; max-width:440px; margin:auto; padding:12px; display:grid; gap:10px; text-align:center}
.card .pic{height:min(34vh,260px); overflow:hidden; border:2px solid var(--edge)}
.card .pic img{width:100%; height:100%; object-fit:cover; object-position:50% 28%; display:block; animation:bob 1.1s steps(1,end) infinite}
.card h2{margin:0; font-size:22px; font-weight:400; line-height:1.25}
.card .sub{font-size:12px; color:var(--dim); line-height:1.4}
.card label{font-size:12px; color:var(--dim); display:block; text-align:left}
.card input{width:100%; margin-top:4px; padding:9px 10px; font:16px var(--font); color:var(--ink); background:#04122e; border:2px solid var(--edge); border-radius:4px}
.btn{display:block; width:100%; padding:12px; font-size:18px; background:#1f6feb; border:3px solid var(--edge); border-radius:4px; box-shadow:0 0 0 2px var(--edge-dark); cursor:pointer}
.btn:active{background:#164fb0}
.res .big{font-size:13px; color:var(--dim)}
.res .val{font-size:26px; color:var(--cyan); font-variant-numeric:tabular-nums}
.verdict{font-size:18px; color:var(--hot)}
.gift{border:3px solid var(--gold); color:var(--gold); padding:12px 8px; font-size:26px; line-height:1.2; animation:pulse 1s steps(1,end) infinite}
@keyframes pulse{50%{background:rgba(255,210,74,.14)}}
.list{text-align:left; font-size:13px; line-height:1.7; border-top:1px solid var(--edge-dark); padding-top:8px}
.list div{display:flex; justify-content:space-between; gap:10px}
.list span:last-child{color:var(--gold); white-space:nowrap}
.bday{font-size:15px; color:var(--gold); line-height:1.5}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.stage,.card .pic img,.call,.arrow,.gift,.blink,.rise,.drip,.steam,.slide,.siren1,.siren2,.glow,.act.sparkle,.act.sparkle::before,.act.sparkle::after{animation:none}.scene.shake{animation:none}}

.intro{position:fixed; inset:0; z-index:40; background:#02050f; color:var(--ink); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer;
  padding-top:max(12px,env(safe-area-inset-top,0px)); padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro[hidden]{display:none}
.stg{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center;
  padding-top:max(12px,env(safe-area-inset-top,0px)); padding-bottom:max(12px,env(safe-area-inset-bottom,0px)); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.stg.on{display:flex}
.ishi{font-size:clamp(30px,10vw,46px); letter-spacing:.08em; line-height:1.2; color:#f3f7ff; text-shadow:3px 3px 0 #1f6feb,6px 6px 0 #03102a; animation:inStep 1.4s steps(8,end) both}
.ishi-sub{font-size:12px; letter-spacing:.35em; color:var(--dim); animation:inStep 1.4s steps(8,end) .5s both}
@keyframes inStep{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.wolfs{width:min(78vw,340px); height:auto; shape-rendering:crispEdges; animation:inStep 1.1s steps(6,end) both}
.wname{font-size:clamp(24px,7.5vw,34px); letter-spacing:.14em; color:#dfe6f7; text-shadow:3px 3px 0 #2b3350; animation:inStep 1.2s steps(6,end) .4s both}
.wsub{font-size:11px; letter-spacing:.3em; color:var(--dim); animation:inStep 1.2s steps(6,end) .8s both}
.ttl-bg{position:absolute; inset:0; background-color:#02050f; background-repeat:no-repeat; background-size:100% auto; background-position:50% 100%; filter:brightness(.55) saturate(1.2); animation:bob 1.1s steps(1,end) infinite}
.ttl-in{position:relative; margin-bottom:34vh; display:flex; flex-direction:column; align-items:center; gap:14px; animation:inStep 1.2s steps(8,end) both}
.ttl-main{font-size:clamp(34px,11.5vw,54px); line-height:1.18; color:#ffd24a; letter-spacing:.04em; text-shadow:3px 3px 0 #b3261e,6px 6px 0 #03102a,-2px -2px 0 #03102a,2px -2px 0 #03102a,-2px 2px 0 #03102a}
.ttl-sub{font-size:clamp(16px,5vw,22px); color:#fff; letter-spacing:.12em; text-shadow:2px 2px 0 #03102a}
.ttl-tap{margin-top:22px; font-size:15px; color:#fff; letter-spacing:.2em; text-shadow:2px 2px 0 #03102a; animation:blink .9s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){.ishi,.ishi-sub,.wolfs,.wname,.wsub,.ttl-in,.ttl-bg,.ttl-tap{animation:none}}
.stg-story{background:#000; justify-content:center; align-items:center}
.sto-text{white-space:pre-wrap; font-size:clamp(17px,5.2vw,22px); line-height:1.9; letter-spacing:.06em; color:#f3f7ff; max-width:22em; min-height:11em; display:flex; align-items:center; justify-content:center; text-align:center}
.sto-arrow{position:absolute; left:0; right:0; bottom:calc(max(24px,env(safe-area-inset-bottom,0px)) + 16px); text-align:center; color:var(--gold); font-size:15px; animation:blink .8s steps(1,end) infinite}
</style>

  <header class="head panel">
    <div>
      <h1>翔馬育成シミュレーション</h1>
      <div class="sub">～ 自立への道（※道は塞がれています）～</div>
    </div>
    <div class="day" id="day">1日目<br>月曜日</div>
  </header>

  <section class="scene panel" id="scene" aria-label="翔馬の部屋">

function applyFx(fx){
  if(!fx) return;
  if(fx.motiv) S.motiv=clamp(S.motiv+fx.motiv);
  if(fx.indep) S.indep=clamp(S.indep+fx.indep);
  if(fx.hp) S.hp=clamp(S.hp+fx.hp);
  if(fx.pay) S.pay+=fx.pay;
  if(fx.cash) S.cash+=fx.cash;
  paint();
}

function setSpeaker(n){

  if(n==='翔馬'){var im=document.createElement('img');im.src=FACE;im.alt='';av.appendChild(im);}

  else if(n===''){av.classList.add('nar');av.textContent='▶';}
  else {av.classList.add('oth');av.textContent=n.charAt(0);}
  $('nm').textContent=n===''?'ナレーション':n;
}
function typewrite(text,needTap,after){
  clearInterval(timer); full=text; var i=0; typing=true; waiting=false; afterType=after||null; typewrite.need=needTap;
  $('arrow').hidden=true; $('ms').textContent='';
  timer=setInterval(function(){
    i++; $('ms').textContent=full.slice(0,i);
    if(i>=full.length) finishType();
  },26);
}
function finishType(){
  clearInterval(timer); typing=false; $('ms').textContent=full;
  if(typewrite.need){waiting=true; $('arrow').hidden=false;}
  var a=afterType; afterType=null; if(a) a();
}
function setBusy(b){
  busy=b;
  var bs=document.querySelectorAll('.act');
  for(var i=0;i<bs.length;i++) bs[i].disabled=b;
}
function shakeScene(){
  var sc=$('scene'); sc.classList.remove('shake'); void sc.offsetWidth; sc.classList.add('shake');
  setTimeout(function(){sc.classList.remove('shake');},420);
}
function showCall(c){
  var el=$('call');
  if(!c){el.hidden=true;return;}
  el.textContent=c.l; el.className='call'+(c.k==='line'?' line':''); el.hidden=false;
}
function showStep(s){
  setSpeaker(s.n);
  showCall(s.call);
  if(s.e!==undefined) setScene(s.e);
  if(s.shake||(s.call&&s.call.k==='call')) shakeScene();
  if(s.fn) s.fn();
  applyFx(s.fx);
  if(s.idle) typewrite(s.t,false,function(){var d=onDone;onDone=null;showCall(null);if(d)d();});
  else typewrite(s.t,true,null);
}
function next(){
  if(!queue.length){ showCall(null); var d=onDone; onDone=null; if(d) d(); return; }
  showStep(queue.shift());
}
function play(steps,done){ setBusy(true); queue=steps.slice(); onDone=done; next(); }
$('dialog').addEventListener('click',function(){
  if(typing){finishType();return;}
  if(waiting){waiting=false;$('arrow').hidden=true;next();}
});
function st(n,t,o){var s={n:n,t:t};if(o){for(var k in o)s[k]=o[k];}return s;}

  if(slot===0) return ['job','skip'];

    return shuffle(['game','borrow','nap','study']).slice(0,2+(Math.random()<0.5?1:0));
  }
  l=['drink'].concat(shuffle(['bath','yt','mom']).slice(0,1+(Math.random()<0.5?1:0)));
  return shuffle(l);
}

/* ================= flow ================= */
function choose(k){
  var steps;
  if(k==='job'){ startHunt(); return; }
  if(k==='drink'){ askVenue(); return; }
  if(k==='skip'){S.c.skip++;steps=buildSkip();}
  else if(k==='game'){S.c.game++;steps=buildGame();}
  else if(k==='borrow'){S.c.borrow++;steps=buildBorrow();}
  else if(k==='nap'){S.c.nap++;steps=buildNap();}
  else if(k==='study'){S.c.study++;steps=buildStudy();}
  else if(k==='bath'){S.c.bath++;steps=buildBath();}
  else if(k==='yt'){S.c.yt++;steps=buildYt();}
  else if(k==='mom'){S.c.mom++;steps=buildMom();}
  else if(k==='pachi'){S.c.pachi++;S.akaNext=true;steps=buildPachi();}
  else if(k==='akabane'){steps=buildAkabane();}
  else if(k==='solo'){S.c.solo++;steps=buildSolo();}
  else if(k==='eat'){S.c.eat++;steps=buildEat();}
  else{S.c.rest++;steps=buildRest();}
  play(steps,function(){afterAction(k);});
}
function goNight(){
  play(nightSteps(),function(){ S.day++; S.slot=0; paint(); morning(); });
}
function afterAction(k){
  if(S.slot>=2 || k==='rest' || k==='pachi'){
    if(S.day>=LAST_DAY){ play(endingSteps(),showResult); } else { goNight(); }
    return;
  }
  S.slot++; paint();
  S.menu=slotMenu(S.slot);
  var t=(S.slot===1)?'午後3時。ここからは、自由時間！':'午後6時。夜になった。';
  play([st('',t,{e:'none',idle:true})],unlock);
}
function morning(){
  var steps=[];
  S.hang=false;
  if(S.day===4){
    S.drank=false;
    steps=allowSteps();
    steps.push(st('','お昼すぎ。翔馬は 1万円を握りしめて、家を出た。今日は、これしかない！',{e:'none'}));
    S.slot=1; S.menu=['pachi'];
  }else if(S.akaNext){
    S.akaNext=false; S.drank=false;
    steps=akaDaySteps();
    S.slot=2; S.menu=['akabane'];
  }else if(S.drank){
    S.drank=false; S.hang=true;
    steps=wakeSteps();
    S.slot=1; S.menu=['solo','eat','rest'];
  }else{
    S.slot=0; S.menu=slotMenu(0);
    steps.push(st('翔馬',GREETS[S.day%GREETS.length],{e:'none'}));
  }
  paint();
  steps[steps.length-1].idle=true;
  play(steps,unlock);
}

/* ================= result ================= */
function showResult(){
  $('rIndep').textContent=S.indep+' / 100';
  var home=(S.end==='home');
  $('rVerdict').textContent=home?'判定：自立して一人暮らし':(S.end==='jail'?'判定：逮捕':'判定：路上暮らし');
  $('rGift').textContent=home?'プレゼント（大）':'プレゼント（小）';
  $('rGift').className='gift'+(home?' big':'');
  $('rSub').textContent=home?'ついに自立！翔馬、プレゼント（大）を獲得しました！':'自立できていれば「プレゼント（大）」でした。';
  var c=S.c, rows=[
    ['履歴書を送った社数',S.resumes+'社'],
    ['就職活動をやめた回数',c.huntQuit+'回'],
    ['カーちゃんの介護求人',c.kaa+'回'],
    ['サボった回数',c.skip+'回'],
    ['飲みに行って暴れた回数',c.fight+'回'],
    ['盗んだ自転車',c.bike+'台'],
    ['飲みに行けなかった回数',c.drinkFail+'回'],
    ['課金した回数',c.game+'回'],
    ['雄大に断られた回数',c.borrow+'回'],
    ['最終Pay決済残高',yen(S.pay)]
  ];
  if(c.pachi) rows.splice(7,0,['パチンコの勝ち','+20,000円']);
  if(c.nanpa) rows.push(['美人局にあった回数',c.nanpa+'回']);
  if(S.lostCash) rows.push(['美人局で取られた現金',yen(S.lostCash)]);
  if(S.repaid) rows.push(['児玉に回収された返済','8,000円']);
  rows.push(['最終所持金',yen(S.cash)]);
  var h=''; for(var i=0;i<rows.length;i++) h+='<div><span>'+rows[i][0]+'</span><span>'+rows[i][1]+'</span></div>';
  $('rList').innerHTML=h;
  $('bday').textContent=(S.name?S.name+'、':'')+'お誕生日おめでとう！';
  $('result').hidden=false; $('result').scrollTop=0;
}

/* ================= start ================= */
function freshState(name){
  return {day:0,slot:0,motiv:20,indep:5,hp:80,cash:10000,pay:10000,name:name||'',menu:['job','skip'],
    drank:false,hang:false,stolen:false,hurt:false,end:'',resumes:0,lostCash:0,
    pachiDay:4+Math.floor(Math.random()*2),pachiDone:false,akaNext:false,repaid:false,
    c:{job:0,kaa:0,huntOk:0,huntQuit:0,skip:0,drinkOk:0,drinkFail:0,fight:0,bike:0,game:0,borrow:0,nap:0,study:0,bath:0,yt:0,mom:0,solo:0,eat:0,rest:0,nights:0,pachi:0,aka:0,nanpa:0}};
}
function startGame(){
  var nm='';
  S=freshState(nm);
  jobs=shuffle(JOBS); games=shuffle(GAMES); borrows=shuffle(BORROWS);
  var sc=$('scene'); sc.classList.remove('street'); $('tag').hidden=true; $('tag').dataset.k=''; $('hurtSvg').hidden=true;
  setScene('none'); showCall(null);
  $('result').hidden=true;
  paint(); layout();
  play([st('翔馬',GREETS[0],{e:'none',idle:true})],unlock);
}
$('hurtSvg').innerHTML=bandage();
$('again').addEventListener('click',function(){startGame();});
window.addEventListener('resize',layout);
if(window.ResizeObserver){new ResizeObserver(layout).observe($('scene'));}

/* ================= intro ================= */
(function(){
  var L=["G.........","GG........","GgG.......","GggG......","GgdgG.....","GgddgG....","GgddggGGGG","GgdgggGggg","GgGGgggggg","GgggyyGggg","GgggykgGgg","GGgggggggg",".GgggggGww",".GGggggGww","..GgggggwK","..GGgggggw","...GggggwK","....GGGGGK"];
  var PAL={g:'#8a93a6',G:'#343a50',w:'#e8ecf4',y:'#ffd24a',k:'#0b0b12',K:'#0b0b12',d:'#d98aa0'};
  function wolf(ox,oy,sc,flip){
    var o='';
    for(var y=0;y<L.length;y++){
      var r=L[y]+L[y].split('').reverse().join('');
      for(var x=0;x<r.length;x++){ var c=PAL[r.charAt(x)]; if(c) o+='<rect x="'+(ox+x*sc)+'" y="'+(oy+y*sc)+'" width="'+sc+'" height="'+sc+'" fill="'+c+'"/>'; }
    }
    return o;
  }
  var pack=wolf(0,13,.55,0)+wolf(41,13,.55,0)+wolf(14,0,1.2,0);
  $('wolfs').innerHTML=pack;
  $('ttlBg').style.backgroundImage='url('+BASE_SRC+')';
  var stage=0, tm=0, hold=false;

  var PAGES=[
    "とある日のこと…",
    "翔馬は 35歳。\n仕事もせず、\n今日も 昼まで寝ていた。",
    "財布の中身は 現金1万円。\nスマホのPayも 1万円。",
    "友達には お金を借りていて、\n母ちゃんは 毎日のように\n介護の求人を 持ってくる。",
    "それでも 翔馬は 笑っていた。\n「ま、なんとかなるっしょ！」",
    "これは、7日間で 自立を目指す\n男の物語である。\n\n（※道は塞がれています）"
  ];
  var sp=0, st4=null, typ4=false, tx4='';
  function typeStory(txt){
    clearInterval(st4); tx4=txt; typ4=true; var i=0; $('stoArrow').hidden=true; $('stoText').textContent='';
    st4=setInterval(function(){ i++; $('stoText').textContent=tx4.slice(0,i); if(i>=tx4.length){ clearInterval(st4); typ4=false; $('stoArrow').hidden=false; } },55);
  }
  function startStory(){ clearTimeout(tm); sp=0; show(4); typeStory(PAGES[0]); }
  function storyTap(){
    if(typ4){ clearInterval(st4); typ4=false; $('stoText').textContent=tx4; $('stoArrow').hidden=false; return; }
    sp++;
    if(sp>=PAGES.length){ $('intro').hidden=true; startGame(); return; }
    typeStory(PAGES[sp]);
  }
  function show(n){
    clearTimeout(tm); stage=n;
    for(var i=1;i<=4;i++) $('stg'+i).className='stg'+(i===n?' on':'');
    if(n===1) tm=setTimeout(function(){show(2);},2300);
    else if(n===2) tm=setTimeout(function(){show(3);},2500);
  }
  function advance(){
    if(stage===1) show(2);
    else if(stage===2) show(3);
    else if(stage===3){ startStory(); }
    else if(stage===4){ storyTap(); }
  }
  $('intro').addEventListener('click',advance);
  $('intro').addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();} });
  show(1);
})();

S=freshState('');
setSpeaker('翔馬'); paint(); layout(); setBusy(true); renderMenu(S.menu);
})();
</script>
